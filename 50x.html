<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Service temporarily unavailable | Maibida</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
    }
    main { width: min(720px, calc(100% - 40px)); text-align: center; padding: 56px 0; }
    .code { margin: 0 0 12px; color: #1d67b2; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
    h1 { margin: 0 0 14px; font-size: clamp(32px, 6vw, 56px); line-height: 1.08; }
    p { margin: 0 auto 28px; max-width: 560px; color: #526071; font-size: 17px; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { display: inline-block; padding: 12px 18px; border-radius: 6px; text-decoration: none; font-weight: 700; background: #1d67b2; color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="code">TEMPORARY ERROR</p>
    <h1>Service temporarily unavailable</h1>
    <p>The website is briefly unavailable. Please refresh in a moment, or contact Maibida directly if you need urgent product or application support.</p>
    <nav aria-label="Error page navigation">
      <a href="/index.html">Return to homepage</a>
    </nav>
  </main>
</body>
</html>
