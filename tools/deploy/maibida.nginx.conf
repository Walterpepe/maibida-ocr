include /etc/nginx/snippets/maibida-http-maps.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name maibida.com www.maibida.com;
    return 301 https://www.maibida.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maibida.com;

    ssl_certificate     /etc/letsencrypt/live/www.maibida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.maibida.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.maibida.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.maibida.com;

    ssl_certificate     /etc/letsencrypt/live/www.maibida.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.maibida.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/maibida/current;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    include /etc/nginx/snippets/maibida.locations.conf;
}
