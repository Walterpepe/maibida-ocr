# Include this file from Nginx's http context. It is safe to load once.
limit_req_zone $binary_remote_addr zone=maibida_messages:10m rate=8r/m;

map $http_accept $maibida_webp_ext {
    default   "";
    "~*webp"  ".webp";
}

map $http_x_forwarded_proto $maibida_forwarded_proto {
    default  $scheme;
    https    https;
    http     http;
}
