include /etc/nginx/snippets/maibida-http-maps.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name maibida.com www.maibida.com;

    root /var/www/maibida/current;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    include /etc/nginx/snippets/maibida.locations.conf;
}
