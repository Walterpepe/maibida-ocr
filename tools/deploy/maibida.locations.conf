# Canonical old homepage filename. The index module serves "/" without a redirect.
location = /index.html {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    return 301 /$is_args$args;
}

# Retired locale editions.
location = /index.en-AU.html                { return 301 /index.en-SG.html; }
location = /product/10032.en-AU.html        { return 301 /product/10032.en-SG.html; }
location = /product/smart-camera.en-AU.html { return 301 /product/smart-camera.en-SG.html; }
location = /product/smart-camera.es-ES.html { return 301 /product/smart-camera.es-MX.html; }

location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    try_files $uri =404;
}

# Never expose maintenance tooling, VCS/private files, backups, or local data.
location ~ ^/(?:tools/|_[^/]+$) { return 404; }
location ~ ^/(?:_bak_[^/]+|productInfo_bak_seo|UserFiles_bak_bigimg)(?:/|$) { return 404; }
location ~ /\.(?:env|git|htpasswd|htaccess)(?:/|$) { return 404; }
location ~* \.(?:bak[^.]*|orig|corrupted|pre_textremove|prev_repair|delogo|v3inpaint|ndjson|tmp|temp|zip|tar|gz|tgz|pyc)$ { return 404; }

location = /api/messages {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    limit_req zone=maibida_messages burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $maibida_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8899;
}

location ~* \.(?:png|jpe?g)$ {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Vary "Accept" always;
    add_header Cache-Control "public, max-age=604800" always;
    add_header CDN-Cache-Control "public, max-age=604800" always;
    try_files $uri$maibida_webp_ext $uri =404;
}

location ~* \.(?:webp|avif|gif|svg|ico|css|js|woff2?|ttf|eot|mp4|webm|pdf)$ {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    add_header CDN-Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

location = /robots.txt {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /sitemap.xml {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ~* \.(?:html?|xml|txt)$ {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header CDN-Cache-Control "no-cache" always;
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

location = /404.html {
    internal;
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header X-Robots-Tag "noindex, follow" always;
}

location = /50x.html {
    internal;
    include /etc/nginx/snippets/maibida-security-headers.conf;
    add_header X-Robots-Tag "noindex, follow" always;
}
